server_bin: /home/dev/workspace/llama.cpp/build/bin/llama-server
manager_port: 8080
restart_delay: 5s
# Give up after this many consecutive fast restarts (0 = never give up). A run
# that stays up past ~2 minutes resets the count.
max_restarts: 10
health_check_interval: 30s
health_check_timeout: 5s
# Mark an instance unhealthy and force-restart it after this many consecutive
# failed health checks (set to 0 to disable, never force-restart).
unhealthy_after: 3

# GPU backend: vulkan, cuda, rocm, rocm_rocr, metal
gpu_backend: vulkan

# Default server arguments (applied to all instances)
# host is where each llama-server listens (passed as --host); the dashboard
# always listens on all interfaces at manager_port. Use 127.0.0.1 to reach the
# models only through the manager. A change applies on the next (re)start.
host: "0.0.0.0"
ngl: 99
main_gpu: 0
context_length: 16384
cache_type_k: q8_0
cache_type_v: q8_0

# Pass --jinja to llama-server so it applies the model's built-in chat
# template and parses tool calls into the OpenAI format. Required for
# agentic clients (opencode, aider, etc.) to use read_file/edit_file/bash.
# Harmless for plain chat. Override per-instance with `jinja: false`.
jinja: true

# Extra flags appended verbatim to every llama-server launch (after the
# manager's own args, so these win on conflict). Per-instance `extra_args`
# overrides this list. Good agentic-coding defaults for a single user:
#   -np 1             one slot -> full context + prompt-cache reuse across turns
#   -ub 2048 -b 2048  larger batch -> much faster big-prompt processing
#   --cache-reuse 256 reuse KV across turns via shifting
#   -fa on            flash attention (benchmark on gfx906; default is auto)
extra_args: []
#   - -np
#   - "1"
#   - -ub
#   - "2048"
#   - --cache-reuse
#   - "256"

# Extra directories the Models tab should scan for .gguf files. Useful when
# you store models outside of llama.cpp's HF hub cache (e.g. on a separate
# disk). Walked recursively. Multi-part GGUFs (...-00001-of-NNNNN.gguf) are
# deduplicated to a single entry pointing at the first part.
model_dirs: []
#   - /home/dev/models
#   - /mnt/gguf

# Hostnames you use to reach the dashboard or the /v1 API, besides IP
# addresses, localhost and this machine's own hostname (with or without
# .local), which are always accepted. Requests with any other Host header are
# refused, which blocks DNS-rebinding attacks from web pages. "*" disables the
# check.
allowed_hosts: []
#   - llm.home.arpa

# OpenAI-compatible API (/v1). api_keys and default_model can also be set in
# Settings > OpenAI API. With no keys, any key (or none) is accepted from this
# network (never from the internet). A key is a string, or a mapping with a
# name and limits (requests per minute, requests at the same time; 0 = none).
# api_keys:
#   - sk-lm-change-me
#   - name: alice
#     key: sk-lm-change-me-too
#     rpm: 60
#     concurrent: 2
# Model for requests that name a model that isn't running (apps with a fixed
# "gpt-4o"); empty refuses them with model_not_found.
# default_model: my-model
# Web pages allowed to call /v1 from a browser (CORS), or "*" for any. Like
# server_bin, this can only be changed in this file.
# cors_origins:
#   - http://app.lan:3000

# Optional: put /v1 (and nothing else) on the internet with Tailscale Funnel,
# at https://<machine>.<tailnet>.ts.net/v1. Needs Tailscale installed and
# signed in (tailscale up) and at least one API key; on Linux run once
# `sudo tailscale set --operator=<service user>`. Like server_bin, this can
# only be changed in this file.
# public_api:
#   tailscale_funnel: true
#   https_port: 443        # 443, 8443 or 10000
#   max_concurrent: 8      # requests from the internet running at once
#   tailscale_bin: ""      # default: tailscale in PATH, then the macOS app

# Optional: Apache Tika reads documents attached in the chat (old .doc/.ppt,
# email, EPUB, archives, other text encodings, scans with the -full image).
# Without it the browser reads PDF, Word, PowerPoint, Excel, LibreOffice and
# RTF itself. Like server_bin, this can only be changed in this file.
#   docker run -d --name tika --restart unless-stopped -p 127.0.0.1:9998:9998 \
#     --read-only --tmpfs /tmp -m 2g apache/tika:4.2.0
# tika:
#   enabled: true
#   url: http://127.0.0.1:9998
#   timeout: 2m        # per document

# Optional: an image reader, so models that can't see still understand images
# attached in the chat. llama-manager runs a small vision model as the instance
# "image-reader"; it describes each image (text first, then what it shows) and
# the description goes to models without a vision projector. Models with one
# still get the image itself. Like server_bin, this can only be changed here.
#   qwen3.5-2b  unsloth/Qwen3.5-2B-GGUF:Q4_K_M, 2.0 GB download, ~3 GB VRAM (default)
#   qwen3.5-4b  unsloth/Qwen3.5-4B-GGUF:Q4_K_M, 3.4 GB download, ~4.5 GB VRAM,
#               better on documents and charts, ~1.5x slower
# Any other vision model works too: owner/repo:QUANT (its mmproj is downloaded
# with it), or a local .gguf with "--mmproj", "/path/mmproj.gguf" in extra_args.
# image_recognition:
#   enabled: true
#   model: qwen3.5-2b
#   gpu_ids: [4]          # default [0]
#   port: 9095            # default 9095; must not be an instance's port
#   context_length: 16384 # default 16384
#   timeout: 2m           # per image
#   extra_args: []        # its own; the global extra_args don't apply to it.
#                         # It starts with --image-min-tokens 256 (small images
#                         # are misread below that) unless you set your own.

# Optional: image generation. llama-manager runs stable-diffusion.cpp's
# sd-server for each image model, as its own instance; pick one in the chat and
# each message becomes a picture (with a model that edits, attach an image to
# change it). Other apps can use POST /v1/images/generations with "model" set
# to the instance name. Model files are downloaded into the HuggingFace cache
# the first time. Like server_bin, this can only be changed here.
#   model                    download  VRAM      steps  edits        license
#   flux2-klein-4b           8.9 GB    ~10 GB    4      yes          Apache-2.0
#   flux3-klein              10.8 GB   ~12 GB    16     yes          FLUX Kommunity (<$5M revenue)
#   z-image-turbo            11.2 GB   ~12 GB    8      no           Apache-2.0
#   qwen-image-2.1-turbo     18.2 GB   ~20 GB    8      yes          non-commercial
#   qwen-image-edit-2511     23.4 GB   ~24 GB    4      edits only   Apache-2.0
#   qwen-image-edit-2511-q8  32.9 GB   two GPUs  4      edits only   Apache-2.0
# image_generation:
#   enabled: true
#   server_bin: /opt/stable-diffusion.cpp/build/bin/sd-server
#   timeout: 10m          # per image, for every model (each can set its own)
#   models:
#     - model: flux3-klein
#       gpu_ids: [4]      # default [0]; two GPUs put the text encoder on the second
#     - model: qwen-image-edit-2511
#       gpu_ids: [3]
#       # name: edit      # instance name; default: the model's name
#       # port: 9097      # default 9096 + its position; must not be an instance's port
#       # extra_args: []  # its own, e.g. ["--flash-attn", "off"]
#       # loras: [qie-multiple-angles]   # built-in LoRAs to download and offer
#     - model: z-image-turbo
#       gpu_ids: [2]
#       lora_dir: /home/dev/loras/z-image   # your own LoRA files (.safetensors) for this model
#       loras: [z-pixel-art, z-realism]     # built-in: z-pixel-art z-realism z-classic-painting
# Built-in LoRAs (README, LoRAs): z-* for z-image-turbo, klein-pixel-art
# klein-anime klein-sketch-to-image for flux2-klein-4b, qie-multiple-angles
# qie-anything2real qie-object-remover for the qwen-image-edit-2511 models.
# The single-model form also works: model, gpu_ids, port, extra_args, lora_dir
# and loras right under image_generation, run as the instance "image-gen".

# Optional: a prompt enhancer for image models. In the chat, "Enhance" next to
# an image model's prompt turns a few words into a detailed description (to
# edit before sending). It uses the image reader's model (image_recognition
# must be on), so it needs no extra VRAM. Like server_bin, this can only be
# changed here.
# prompt_enhancer:
#   enabled: true
#   timeout: 2m           # per prompt
# To use another model instead, in an instance of its own ("prompt-enhancer",
# with VRAM of its own), add model: owner/repo:QUANT (or a .gguf) and, if
# needed, gpu_ids, port (default 9120), context_length (default 8192) and
# extra_args.

# Optional: text to speech. A play button under each chat reply reads it aloud
# (pick the voice under Chat settings); other apps can use POST /v1/audio/speech.
# Each voice model runs as its own instance. Like server_bin, this can only be
# changed here.
#   model       runs in                         download  VRAM   languages
#   ming3-tts   audio.cpp's audiocpp_server     1.7 GB    ~2 GB  en zh ja ko de fr es (best voice, MIT)
#   qwen3-tts   llama-server (llama.cpp 0.8+)   2.3 GB    ~3 GB  en ru zh de fr es it pt ja ko (your voice)
#   lfm3-audio  llama-server (llama.cpp 0.8+)   2.2 GB    ~3 GB  18 languages, no ru (female/male)
# text_to_speech:
#   enabled: true
#   server_bin: /opt/audio.cpp/build/linux-hip-release/bin/audiocpp_server  # for ming3-tts
#   # backend: vulkan     # audio.cpp's backend; default follows gpu_backend
#   timeout: 2m           # per part of a reply
#   models:
#     - model: ming3-tts
#       gpu_ids: [4]      # one GPU; default [0]
#       # name: voice     # instance name; default: the model's name
#       # port: 9110      # default 9110 + its position
#     - model: qwen3-tts
#       gpu_ids: [4]
#       voices:           # qwen3-tts speaks with your recordings: WAV or MP3, 3-20 s
#         - {name: me, file: /home/dev/voices/me.wav}

# Per-instance settings. `auto_start: true` makes the manager launch that
# instance on boot; omit it (or set false) and the instance stays stopped until
# you start it from the UI. Default is false — handy when you have several
# configured models that can't all run at once (they'd otherwise fight for
# GPUs/VRAM on reboot). It also gates the immediate start when you add/edit an
# instance via the UI.
instances:
  - name: dolphin-gpu0
    model: "bartowski/cognitivecomputations_Dolphin-Mistral-24B-Venice-Edition-GGUF:IQ4_XS"
    port: 9090
    gpu_id: 0
    auto_start: false  # true = launch on boot

  - name: dolphin-gpu1
    model: "bartowski/cognitivecomputations_Dolphin-Mistral-24B-Venice-Edition-GGUF:IQ4_XS"
    port: 9091
    gpu_id: 1

  - name: dolphin-gpu2
    model: "bartowski/cognitivecomputations_Dolphin-Mistral-24B-Venice-Edition-GGUF:IQ4_XS"
    port: 9092
    gpu_id: 2

  - name: dolphin-gpu3
    model: "bartowski/cognitivecomputations_Dolphin-Mistral-24B-Venice-Edition-GGUF:IQ4_XS"
    port: 9093
    gpu_id: 3

  - name: dolphin-gpu4
    model: "bartowski/cognitivecomputations_Dolphin-Mistral-24B-Venice-Edition-GGUF:IQ4_XS"
    port: 9094
    gpu_id: 4
